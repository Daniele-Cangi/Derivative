<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Forge verification gates</title>
  <desc id="desc">Three independent validation layers must all pass before Forge packages generated code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6f2"/>
      <stop offset="1" stop-color="#e7efea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17362f" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d8d84"/>
    </marker>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <g font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">
    <text x="60" y="66" fill="#17312c" font-size="31" font-weight="700">Verification is a conjunction, not a confidence score</text>
    <text x="60" y="98" fill="#577068" font-size="17">All three layers must pass. Any missing obligation, weak test, or provenance mismatch fails closed.</text>

    <g filter="url(#shadow)">
      <rect x="60" y="142" width="290" height="170" rx="20" fill="#ffffff" stroke="#aac1ba"/>
      <rect x="84" y="165" width="38" height="38" rx="10" fill="#dcece6"/>
      <text x="103" y="191" text-anchor="middle" fill="#1f6b58" font-size="18" font-weight="700">1</text>
      <text x="84" y="232" fill="#18352e" font-size="21" font-weight="700">Runtime integrity</text>
      <text x="84" y="263" fill="#5e746e" font-size="14">Materialize, parse, import, build</text>
      <text x="84" y="286" fill="#5e746e" font-size="14">and execute declared entrypoints.</text>
    </g>

    <path d="M 350 227 L 416 227" stroke="#6d8d84" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="424" y="142" width="290" height="170" rx="20" fill="#ffffff" stroke="#aac1ba"/>
      <rect x="448" y="165" width="38" height="38" rx="10" fill="#e7edcd"/>
      <text x="467" y="191" text-anchor="middle" fill="#69791c" font-size="18" font-weight="700">2</text>
      <text x="448" y="232" fill="#18352e" font-size="21" font-weight="700">Contract evidence</text>
      <text x="448" y="263" fill="#5e746e" font-size="14">Run tests and prove acceptance,</text>
      <text x="448" y="286" fill="#5e746e" font-size="14">obligations and quality coverage.</text>
    </g>

    <path d="M 714 227 L 780 227" stroke="#6d8d84" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="788" y="142" width="352" height="170" rx="20" fill="#ffffff" stroke="#aac1ba"/>
      <rect x="812" y="165" width="38" height="38" rx="10" fill="#f1e2dd"/>
      <text x="831" y="191" text-anchor="middle" fill="#95513f" font-size="18" font-weight="700">3</text>
      <text x="812" y="232" fill="#18352e" font-size="21" font-weight="700">Adversarial attack</text>
      <text x="812" y="263" fill="#5e746e" font-size="14">Detect stubs, fake coverage, manifest drift,</text>
      <text x="812" y="286" fill="#5e746e" font-size="14">missing provenance and unproven universals.</text>
    </g>

    <rect x="458" y="340" width="284" height="34" rx="17" fill="#173c33"/>
    <text x="600" y="363" text-anchor="middle" fill="#eaf8f3" font-size="14" font-weight="700" letter-spacing="1">PASS ALL 3  ->  PACKAGE</text>
  </g>
</svg>
