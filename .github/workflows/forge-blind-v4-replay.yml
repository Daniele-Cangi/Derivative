name: Forge Blind v4 Replay

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Frozen blind v4 case id to replay
        required: true
        default: V4-001

permissions:
  contents: read

jobs:
  post-fix-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current Forge revision
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Forge sandbox image
        run: docker build --file Dockerfile.forge-sandbox --tag derivative-forge-sandbox:py311 .

      - name: Execute selected post-fix replay
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1
          OPENAI_INPUT_COST_PER_1M_TOKENS: "2.00"
          OPENAI_OUTPUT_COST_PER_1M_TOKENS: "8.00"
        run: >
          python forge_blind_benchmark.py
          --manifest benchmarks/blind_v4/external_007/manifest.json
          --mode hybrid
          --execution-backend docker
          --sandbox-image derivative-forge-sandbox:py311
          --post-fix-replay
          --case-id "${{ inputs.case_id }}"
          --no-enforce-thresholds

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-blind-v4-replay-${{ inputs.case_id }}
          path: |
            generated_artifacts/forge_blind_benchmarks/
            generated_artifacts/forge_blind_runs/
            generated_artifacts/forge_blind_packages/
          if-no-files-found: warn
          retention-days: 90
