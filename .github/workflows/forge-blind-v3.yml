name: Forge Blind v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-blind-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout frozen repository state
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Forge sandbox image
        run: docker build --file Dockerfile.forge-sandbox --tag derivative-forge-sandbox:py311 .

      - name: Verify frozen blind bundle
        run: >
          python -c
          "from core.forge.blind_benchmark import load_blind_bundle;
          bundle = load_blind_bundle('benchmarks/blind_v3/external_002/manifest.json', verify_baseline=False);
          assert len(bundle.cases) == 12;
          print(f'sealed_inputs_verified baseline_verified={bundle.baseline_verified}')"

      - name: Execute model-backed post-fix replay
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: >
          python forge_blind_benchmark.py
          --manifest benchmarks/blind_v3/external_002/manifest.json
          --mode hybrid
          --execution-backend docker
          --sandbox-image derivative-forge-sandbox:py311
          --post-fix-replay
          --no-enforce-thresholds

      - name: Upload complete blind evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-blind-v3-model-backed-replay
          path: |
            generated_artifacts/forge_blind_benchmarks/
            generated_artifacts/forge_blind_runs/
            generated_artifacts/forge_blind_packages/
          if-no-files-found: warn
          retention-days: 90
