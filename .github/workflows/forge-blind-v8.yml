name: Forge Blind v8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-blind-run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Require main branch dispatch
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout frozen repository state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements/blind-v8-linux-py311.lock

      - name: Build Forge sandbox image
        run: docker build --file Dockerfile.forge-sandbox --tag derivative-forge-sandbox:py311 .

      - name: Verify frozen blind bundle and baseline
        run: >
          python -c
          "from core.forge.blind_benchmark import load_blind_bundle;
          bundle = load_blind_bundle('benchmarks/blind_v8/external_001/manifest.json', verify_baseline=True);
          assert bundle.bundle_id == 'forge-blind-v8-external-001';
          assert bundle.schema_version == 3;
          assert len(bundle.cases) == 12;
          assert len(bundle.oracle_sha256) == 6;
          assert bundle.baseline_verified;
          print(f'sealed_inputs_verified baseline={bundle.baseline_sha256}')"

      - name: Record immutable execution context
        env:
          OPENAI_MODEL: gpt-4.1-2025-04-14
        run: |
          mkdir -p generated_artifacts/forge_blind_benchmarks
          printf '{"git_sha":"%s","model":"%s","run_id":"%s","run_attempt":"%s","execution_backend":"docker","manifest_sha256":"071c7d11d5a6d6cab46198b1464cd03f8b8afcdcceaad23e7f93d7e283ae12c1"}\n' "$GITHUB_SHA" "$OPENAI_MODEL" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > generated_artifacts/forge_blind_benchmarks/v8_execution_context.json
          python -m pip freeze --all > generated_artifacts/forge_blind_benchmarks/v8_dependency_snapshot.txt

      - name: Execute first and only blind v8 baseline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-2025-04-14
          OPENAI_INPUT_COST_PER_1M_TOKENS: "2.00"
          OPENAI_OUTPUT_COST_PER_1M_TOKENS: "8.00"
        run: >
          python forge_blind_benchmark.py
          --manifest benchmarks/blind_v8/external_001/manifest.json
          --mode hybrid
          --execution-backend docker
          --sandbox-image derivative-forge-sandbox:py311
          --no-enforce-thresholds

      - name: Upload complete blind evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-blind-v8-first-run
          path: |
            generated_artifacts/forge_blind_benchmarks/
            generated_artifacts/forge_blind_runs/
            generated_artifacts/forge_blind_packages/
          if-no-files-found: warn
          retention-days: 90
